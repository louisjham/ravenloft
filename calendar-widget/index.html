<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Calendar Widget</title>
    <!-- Modern Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Google Material Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="calendar.css">
</head>
<body>
    <div id="calendar_box">
        <div id="calendar_header">
            <span id="prev" class="material-symbols-outlined" style="cursor: pointer;">chevron_left</span>
            <span id="date_display"></span>
            <span id="next" class="material-symbols-outlined" style="cursor: pointer;">chevron_right</span>
        </div>
        <div id="calendar_body">
            <div class="weekdays">
                <div>Su</div>
                <div>Mo</div>
                <div>Tu</div>
                <div>We</div>
                <div>Th</div>
                <div>Fr</div>
                <div>Sa</div>
            </div>
            <div id="days" class="days">
                <!-- Dynamically generated days -->
            </div>
        </div>
        
        <!-- Modal overlay background -->
        <div id="modal_overlay"></div>
        
        <!-- Appointment booking modal -->
        <div id="appointment_modal">
            <button id="close_btn">&times;</button>
            <h2>Book an Appointment</h2>
            <form id="appointment_form">
                <label for="time_select">Time Slot:</label>
                <select id="time_select" required>
                    <!-- Dynamic options populated from available slots -->
                </select>
                
                <label for="name_input">Your Name:</label>
                <input type="text" id="name_input" required placeholder="John Doe">
                
                <label for="phone_input">Phone Number:</label>
                <input type="tel" id="phone_input" required placeholder="123-456-7890">
                
                <button type="submit" id="submit_btn">Confirm Appointment</button>
            </form>
        </div>
    </div>

    <script src="calendar.js"></script>
</body>
</html>
